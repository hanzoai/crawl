# Build the image and push it. Nothing else.
#
# This repo had no CI at all: ghcr.io/hanzoai/crawl was a verbatim skopeo mirror
# of docker.io/unclecode/crawl4ai, so it was amd64-only, a digest behind upstream,
# and we could not build it. That is the whole reason for the fork.
#
# No deploy step on purpose. kubectl is absent from the job image, and a CI-side
# patch is reverted within minutes by cd.hanzo.ai's selfHeal, which restores the
# App CR from the reviewed pin in hanzoai/universe. CI's job ends at "the tag
# exists and resolves"; choosing which tag runs is a reviewed change there.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-crawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Must name a label a runner ACTUALLY advertises. The git-runners offer
    # hanzo-build-linux-amd64; a label nothing offers does not fail, it queues
    # until the 24h timeout — silence, not an error.
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # arm64 is emulated, because every runner we have is amd64. This image is
      # Playwright/Chromium, so the arm64 leg is SLOW — tens of minutes, not the
      # couple the amd64 leg takes. It is still the right default: an amd64-only
      # image is exactly the limitation the skopeo mirror had. If this starts
      # timing out, the fix is registering spark (arm64 linux) as a runner and
      # splitting the legs onto native hardware — not dropping arm64.
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }

      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container, driver-opts: network=host }

      # Without this the push is unauthenticated and 403s at the registry.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/hanzoai/crawl:${{ steps.meta.outputs.tag }}

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still mean a future ImagePullBackOff. Prove it pulls, and prove BOTH
      # architectures are actually in the manifest list — a silently amd64-only
      # push is the specific failure this fork exists to prevent.
      - name: Verify the pushed image resolves on both architectures
        run: |
          set -eu
          IMG="ghcr.io/hanzoai/crawl:${{ steps.meta.outputs.tag }}"
          docker buildx imagetools inspect "$IMG" > /tmp/manifest.txt
          cat /tmp/manifest.txt
          for arch in amd64 arm64; do
            grep -q "linux/${arch}" /tmp/manifest.txt \
              || { echo "ERROR: ${IMG} has no linux/${arch} in its manifest"; exit 1; }
          done
          echo "ok: ${IMG} resolves for linux/amd64 and linux/arm64"
